<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Just Married Grand Prix</title>
<style>
  :root{
    --sky:#5cb2ff;
    --sky-deep:#2f7fe0;
    --grass:#3ec14f;
    --road:#57575f;
    --red:#e6394a;
    --red-deep:#b81f30;
    --yellow:#ffcc00;
    --ink:#1b1b1f;
    --cream:#fff8ec;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;overflow:hidden;
    background: var(--sky);
    font-family: 'Courier New', Courier, monospace;
    color:var(--ink);
    -webkit-user-select:none;user-select:none;
    touch-action:none;
    overscroll-behavior:none;
  }
  #wrap{ position:fixed; inset:0; }
  #game{ position:fixed; inset:0; display:block; touch-action:none; }
  #ui{
    position:fixed; inset:0; pointer-events:none;
    display:flex; align-items:center; justify-content:center;
    padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
  }
  .panel{
    pointer-events:auto; text-align:center;
    background: rgba(255,248,236,.97);
    border:4px solid var(--ink);
    border-radius:16px;
    padding: clamp(12px,2.6vw,22px) clamp(12px,3.6vw,26px);
    max-width:94vw; max-height:94vh; overflow-y:auto;
    box-shadow:0 10px 0 var(--sky-deep), 0 14px 30px rgba(0,0,0,.35);
  }
  h1.title{
    font-size:clamp(18px,4.6vw,32px);
    letter-spacing:1px;
    color:var(--red);
    -webkit-text-stroke: 2px var(--ink);
    text-wrap:balance;
    margin:0 0 2px 0;
    line-height:1.15;
  }
  .subtitle{
    font-size:clamp(10px,2.2vw,13px);
    color:var(--ink);
    opacity:.75;
    margin-bottom:10px;
    letter-spacing:.5px;
  }

  /* ---- Avatar builder ---- */
  #builder{ display:flex; gap:16px; flex-wrap:wrap; justify-content:center; align-items:flex-start; }
  #previewCol{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  #previewCanvas{ image-rendering:pixelated; background:linear-gradient(var(--sky),var(--grass) 72%); border:4px solid var(--ink); border-radius:10px; }
  #optionsCol{ text-align:left; width:min(260px,80vw); }
  .presetRow{ display:flex; gap:8px; margin-bottom:10px; justify-content:center; }
  .presetBtn{
    font-family:inherit; font-size:10px; font-weight:bold; letter-spacing:.5px;
    background:var(--sky); border:3px solid var(--ink); border-radius:8px; padding:6px 10px; cursor:pointer;
  }
  .presetBtn:active{ transform:translateY(2px); }
  .fieldLabel{ font-size:10px; font-weight:bold; letter-spacing:1px; text-transform:uppercase; opacity:.7; margin:8px 0 4px; }
  .outfitTabs{ display:flex; gap:6px; }
  .outfitTab{
    flex:1; font-family:inherit; font-size:10px; font-weight:bold;
    background:var(--sky); border:3px solid var(--ink); border-radius:7px; padding:6px 4px; cursor:pointer;
  }
  .outfitTab.active{ background:var(--yellow); box-shadow:0 0 0 2px var(--red) inset; }
  .swatchRow{ display:flex; gap:6px; flex-wrap:wrap; }
  .swatch{
    width:26px; height:26px; border-radius:50%; border:3px solid var(--ink); cursor:pointer; padding:0;
  }
  .swatch.active{ box-shadow:0 0 0 3px var(--red); transform:scale(1.08); }

  button.arcadeBtn{
    font-family:inherit;
    background: var(--red);
    color:#fff;
    border:4px solid var(--ink);
    border-radius:10px;
    padding:12px 26px;
    font-size:15px;
    font-weight:bold;
    letter-spacing:1.5px;
    cursor:pointer;
    box-shadow:0 5px 0 var(--red-deep);
    margin-top:12px;
  }
  button.arcadeBtn:active{ transform:translateY(4px); box-shadow:0 1px 0 var(--red-deep); }
  .hidden{ display:none !important; }
  small.hint{ display:block; margin-top:10px; font-size:9px; opacity:.7; line-height:1.5; }

  #countdownNum{
    font-size:clamp(70px,20vw,130px); color:var(--yellow);
    -webkit-text-stroke:4px var(--ink);
  }

  #hud{
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); left:calc(env(safe-area-inset-left,0px) + 10px);
    display:flex; flex-direction:column; gap:5px; pointer-events:none; z-index:5;
  }
  .hudBox{
    background:rgba(255,248,236,.92); border:3px solid var(--ink); border-radius:8px;
    padding:5px 9px; font-size:clamp(11px,2.6vw,14px); font-weight:bold; color:var(--ink);
    font-variant-numeric: tabular-nums;
  }
  #boostWrap{ width:96px; height:9px; border:2px solid var(--ink); background:rgba(0,0,0,.15); border-radius:4px; overflow:hidden; margin-top:3px;}
  #boostBar{ height:100%; width:0%; background:var(--sky-deep); }

  #leaderboard{
    position:fixed; top:calc(env(safe-area-inset-top,0px) + 10px); right:calc(env(safe-area-inset-right,0px) + 10px);
    display:flex; flex-direction:column; gap:4px; z-index:5;
  }
  .lbRow{
    display:flex; align-items:center; gap:5px; order:4;
    background:rgba(255,248,236,.92); border:2px solid var(--ink); border-radius:8px;
    padding:3px 7px 3px 3px;
  }
  .lbRow.me{ box-shadow:0 0 0 2px var(--red); background:#fff2b8; }
  .lbRow canvas{ image-rendering:pixelated; border-radius:50%; border:2px solid var(--ink); background:var(--sky); }
  .lbRank{ font-size:11px; font-weight:bold; width:16px; text-align:center; color:var(--ink); }
  .lbName{ font-size:9px; font-weight:bold; color:var(--ink); max-width:56px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  #resultBox{ font-size:12px; margin:8px 0 16px; display:flex; flex-direction:column; gap:5px; }
  .resRow{ display:flex; align-items:center; gap:8px; justify-content:center; }
  .resRow canvas{ image-rendering:pixelated; border-radius:50%; border:2px solid var(--ink); background:var(--sky); }
  .resMedal{ width:20px; text-align:center; }

  .ctrlBtn{
    position:fixed; z-index:6; pointer-events:auto;
    width:clamp(56px,15vw,74px); height:clamp(56px,15vw,74px);
    border-radius:50%;
    background:rgba(255,248,236,.85); border:3px solid var(--ink);
    color:var(--ink); font-size:clamp(20px,5vw,28px); font-weight:bold;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 rgba(0,0,0,.25);
    display:none;
  }
  .ctrlBtn.show{ display:flex; }
  .ctrlBtn:active{ transform:translateY(3px); box-shadow:none; }
  #steerLeft{ left:calc(env(safe-area-inset-left,0px) + 14px); bottom:calc(env(safe-area-inset-bottom,0px) + 18px); }
  #steerRight{ left:calc(env(safe-area-inset-left,0px) + 14px + clamp(64px,17vw,84px)); bottom:calc(env(safe-area-inset-bottom,0px) + 18px); }
  #boostBtn{
    right:calc(env(safe-area-inset-right,0px) + 16px); bottom:calc(env(safe-area-inset-bottom,0px) + 20px);
    background:rgba(255,204,0,.9);
    width:clamp(66px,18vw,86px); height:clamp(66px,18vw,86px);
  }
  #minimapCanvas{ position:fixed; z-index:4; pointer-events:none; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="hudBox">LAP <span id="lapNum">1</span>/3</div>
    <div class="hudBox">
      <span id="timeNum">00:00.0</span>
      <div id="boostWrap"><div id="boostBar"></div></div>
    </div>
  </div>
  <div id="leaderboard"></div>

  <div id="ui">
    <!-- AVATAR BUILDER / SELECT SCREEN -->
    <div class="panel" id="selectPanel">
      <h1 class="title">JUST MARRIED<br>GRAND PRIX</h1>
      <div class="subtitle">Build your racer — 3 laps around the reception!</div>
      <div id="builder">
        <div id="previewCol">
          <canvas id="previewCanvas" width="150" height="190"></canvas>
          <div class="presetRow">
            <button class="presetBtn" id="presetGroom">👔 GROOM START</button>
            <button class="presetBtn" id="presetBride">👰 BRIDE START</button>
          </div>
        </div>
        <div id="optionsCol">
          <div class="fieldLabel">Outfit</div>
          <div class="outfitTabs" id="outfitTabs"></div>
          <div class="fieldLabel">Skin Tone</div>
          <div class="swatchRow" id="skinRow"></div>
          <div class="fieldLabel">Hair Color</div>
          <div class="swatchRow" id="hairRow"></div>
          <div class="fieldLabel">Outfit Color</div>
          <div class="swatchRow" id="primaryRow"></div>
          <div class="fieldLabel">Accent Color</div>
          <div class="swatchRow" id="accentRow"></div>
        </div>
      </div>
      <button class="arcadeBtn" id="startBtn">START RACE ▶</button>
      <small class="hint">Tap ◀ ▶ to steer, hold 💨 while turning to boost<br>(or use arrow keys / WASD + space on desktop)</small>
    </div>
    <!-- COUNTDOWN -->
    <div class="panel hidden" id="countdownPanel" style="background:transparent;border:none;box-shadow:none;">
      <div id="countdownNum">3</div>
    </div>
    <!-- FINISH -->
    <div class="panel hidden" id="finishPanel">
      <h1 class="title" id="finishTitle" style="font-size:clamp(18px,4.6vw,30px);">YOU WIN!</h1>
      <div class="subtitle">Thanks for racing at our wedding!</div>
      <div id="resultBox"></div>
      <button class="arcadeBtn" id="againBtn">RACE AGAIN ▶</button>
    </div>
  </div>

  <div class="ctrlBtn" id="steerLeft">◀</div>
  <div class="ctrlBtn" id="steerRight">▶</div>
  <div class="ctrlBtn" id="boostBtn">💨</div>
</div>

<script>
(function(){
"use strict";

/* ============================= CANVAS / VIEWPORT ============================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const viewport = { w: window.innerWidth, h: window.innerHeight };

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  viewport.w = window.innerWidth;
  viewport.h = window.innerHeight;
  canvas.width = Math.round(viewport.w*dpr);
  canvas.height = Math.round(viewport.h*dpr);
  canvas.style.width = viewport.w+'px';
  canvas.style.height = viewport.h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.imageSmoothingEnabled = false;
  updateControlVisibility();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', ()=>setTimeout(resize,60));

function updateControlVisibility(){
  const show = ('ontouchstart' in window) || viewport.w < 900;
  ['steerLeft','steerRight','boostBtn'].forEach(id=>{
    document.getElementById(id).classList.toggle('show', show);
  });
}

/* ============================= HELPERS ============================= */
function pr(g,x,y,w,h,color){
  g.fillStyle = color;
  g.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}
function quad(g,x1,y1,w1,x2,y2,w2,color){
  g.fillStyle = color;
  g.beginPath();
  g.moveTo(x1-w1,y1); g.lineTo(x1+w1,y1); g.lineTo(x2+w2,y2); g.lineTo(x2-w2,y2);
  g.closePath(); g.fill();
}
function roundRectPath(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y);
  g.arcTo(x+w,y,x+w,y+h,r);
  g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);
  g.arcTo(x,y,x+w,y,r);
  g.closePath();
}
function shade(hex, pct){
  const num = parseInt(hex.slice(1),16);
  let r=(num>>16)+Math.round(255*pct), g2=((num>>8)&0xff)+Math.round(255*pct), b=(num&0xff)+Math.round(255*pct);
  r=Math.max(0,Math.min(255,r)); g2=Math.max(0,Math.min(255,g2)); b=Math.max(0,Math.min(255,b));
  return '#'+((1<<24)+(r<<16)+(g2<<8)+b).toString(16).slice(1);
}

/* ============================= AVATAR PALETTE SYSTEM ============================= */
const SKIN_TONES = ['#ffe0bd','#f0b892','#c68642','#8d5524','#5c3a21'];
const HAIR_COLORS = ['#1b1210','#3a2415','#6b4a2a','#d9b36c','#8a4b2f'];
const PRIMARY_COLORS = ['#1fb6b0','#e6394a','#3ec14f','#ffcc00','#2c3e6b','#fff8ec'];
const ACCENT_COLORS = ['#ffffff','#e6394a','#ffcc00','#1fb6b0'];
const OUTFITS = [
  {key:'suit', label:'Suit'},
  {key:'gown', label:'Gown'},
  {key:'casual', label:'Casual'}
];

const PRESETS = {
  groom:     { outfitType:'suit',  skin:'#f0b892', hair:'#7a5230', primary:'#1fb6b0', accent:'#ffffff', label:'Groom' },
  bride:     { outfitType:'gown',  skin:'#f3c39f', hair:'#3a2415', primary:'#fff8ec', accent:'#e6394a', label:'Bride' },
  groomsman: { outfitType:'suit',  skin:'#e8a97a', hair:'#5a3a1a', primary:'#3ec14f', accent:'#ffffff', label:'Groomsman' },
  bridesmaid:{ outfitType:'gown',  skin:'#f0c8a0', hair:'#241005', primary:'#ffcc00', accent:'#e6394a', label:'Bridesmaid' }
};

function buildPalette(cfg){
  return {
    outfitType: cfg.outfitType,
    skin: cfg.skin, hair: cfg.hair,
    outfit: cfg.primary, outfitDark: shade(cfg.primary,-0.24),
    kart: cfg.primary, kartDark: shade(cfg.primary,-0.24),
    trim: cfg.accent, accessory: cfg.accent,
    label: cfg.label || 'Racer'
  };
}

/* ============================= SPRITE DRAWING ============================= */
/* full body, standing, front-facing — used in the avatar builder preview */
function drawFullBodyFront(g, p, cw, ch, unit){
  g.imageSmoothingEnabled = false;
  g.save();
  g.translate(cw/2, ch*0.48);
  g.scale(unit, unit);
  const isGown = p.outfitType==='gown';
  const isCasual = p.outfitType==='casual';

  // legs / skirt
  if(isGown){
    pr(g,-7,1,14,10,p.outfit);
    pr(g,-7,9.5,14,1.6,p.accessory);
    pr(g,-2,10.6,2,2,'#1b1b1f'); pr(g,0,10.6,2,2,'#1b1b1f');
  } else {
    pr(g,-4,4,3,9,shade(p.outfit,-0.35)); pr(g,1,4,3,9,shade(p.outfit,-0.35));
    pr(g,-4,11.5,3,2,'#1b1b1f'); pr(g,1,11.5,3,2,'#1b1b1f');
  }

  // arms
  const sleeve = isGown ? p.skin : p.outfit;
  pr(g,-7,-5,2,7,sleeve); pr(g,-7,1,2,2,p.skin);
  pr(g,5,-5,2,7,sleeve); pr(g,5,1,2,2,p.skin);

  // torso
  if(isGown){
    pr(g,-4,-6,8,7,p.outfit);
    pr(g,-4,0,8,1.4,p.accessory);
  } else {
    pr(g,-5,-6,10,9,p.outfit);
    pr(g,-5,-6,2,4,p.outfitDark); pr(g,3,-6,2,4,p.outfitDark);
    pr(g,-1,-6,2,9,'#ffffff');
    pr(g,-0.8,-6,1.6,2.4,p.accessory);
    if(isCasual){ pr(g,-5,-3,10,1.4,p.accessory); }
  }

  // head + hair
  pr(g,-3,-13,6,6,p.skin);
  if(isGown){
    pr(g,-4,-14,8,3,p.hair);
    pr(g,-4,-11,1.4,8,p.hair); pr(g,2.6,-11,1.4,8,p.hair);
    pr(g,-1,-15,2,1.4,'#ffffff');
  } else {
    pr(g,-3,-14,6,2.4,p.hair);
    if(isCasual){ pr(g,-3.4,-11.4,6.8,1.2,'#222'); }
  }
  pr(g,-2,-10,1,1,'#1b1b1f'); pr(g,1,-10,1,1,'#1b1b1f');
  pr(g,-1.2,-8.4,2.4,0.8,'#a35b3f');

  g.restore();
}

/* small bust icon — used in leaderboard + results rows */
function drawPortraitBust(g, p, cw, ch, unit){
  g.imageSmoothingEnabled = false;
  g.save();
  g.translate(cw/2, ch*0.32);
  g.scale(unit,unit);
  const isGown = p.outfitType==='gown';
  pr(g,-6,6,12,6,p.outfit);
  pr(g,-6,6,12,1.5,p.outfitDark);
  if(!isGown){ pr(g,-1.2,6,2.4,2,'#1b1b1f'); pr(g,-0.6,6,1.2,3,'#fff'); }
  else { pr(g,-6,6,12,2,'#ffffff'); }
  pr(g,-2,4.5,4,2,p.skin);
  pr(g,-4,-2,8,7,p.skin);
  if(isGown){
    pr(g,-5,-3,10,3,p.hair);
    pr(g,-5,-3,1.5,7,p.hair); pr(g,3.5,-3,1.5,7,p.hair);
    pr(g,-1,-4,2,1.4,'#fff');
  } else {
    pr(g,-4,-3,8,2.4,p.hair);
  }
  pr(g,-2.2,1,1.2,1.2,'#1b1b1f'); pr(g,1,1,1.2,1.2,'#1b1b1f');
  pr(g,-1.3,3.2,2.6,0.8,'#a35b3f');
  g.restore();
}
function bustCanvas(p, size){
  const c = document.createElement('canvas'); c.width=size; c.height=size;
  const g = c.getContext('2d');
  drawPortraitBust(g, p, size, size, size/16);
  return c;
}

/* kart + driver, viewed from behind, local unit space (~-16..16 x, -18..12 y) */
function drawFullKartBack(g, p, boostTier){
  const isGown = p.outfitType==='gown';
  // wheels
  pr(g,-13,1,4,9,'#141018'); pr(g,9,1,4,9,'#141018');
  // body
  pr(g,-9,-2,18,10,p.kart);
  pr(g,-9,-2,18,2,p.kartDark);
  pr(g,-1,-1,2,2,'#e6394a');
  // spoiler
  pr(g,-7,-5,14,2,p.trim);
  // exhaust
  pr(g,-2,7,1.6,3,'#8a8a90'); pr(g,0.4,7,1.6,3,'#8a8a90');
  // torso/back
  if(isGown){
    pr(g,-6,-10,12,7,p.outfit);
    pr(g,-4,-15,8,6,p.hair);
  } else {
    pr(g,-5,-10,10,7,p.outfit);
    pr(g,-5,-10,10,1.6,p.outfitDark);
    pr(g,-3,-15,6,6,p.hair);
  }
  // head
  pr(g,-3,-16,6,6,p.skin);
  if(!isGown){ pr(g,-3,-17,6,3,p.hair); }
  // boost flame
  if(boostTier>0){
    const flameColors = ['#5cb2ff','#ffcc00','#e6394a'];
    const c = flameColors[Math.min(boostTier,3)-1];
    pr(g,-4,10,3,4+Math.random()*3,c);
    pr(g,1,10,3,4+Math.random()*3,c);
  }
}

/* ============================= AVATAR BUILDER UI ============================= */
let customConfig = Object.assign({}, PRESETS.groom);

function renderBuilderPreview(){
  const c = document.getElementById('previewCanvas');
  const g = c.getContext('2d');
  g.clearRect(0,0,c.width,c.height);
  drawFullBodyFront(g, buildPalette(customConfig), c.width, c.height, c.height/30);
}
function refreshBuilderUI(){
  document.querySelectorAll('.outfitTab').forEach(el=>{
    el.classList.toggle('active', el.dataset.key===customConfig.outfitType);
  });
  document.querySelectorAll('#skinRow .swatch').forEach(el=>{
    el.classList.toggle('active', el.dataset.color===customConfig.skin);
  });
  document.querySelectorAll('#hairRow .swatch').forEach(el=>{
    el.classList.toggle('active', el.dataset.color===customConfig.hair);
  });
  document.querySelectorAll('#primaryRow .swatch').forEach(el=>{
    el.classList.toggle('active', el.dataset.color===customConfig.primary);
  });
  document.querySelectorAll('#accentRow .swatch').forEach(el=>{
    el.classList.toggle('active', el.dataset.color===customConfig.accent);
  });
  renderBuilderPreview();
}
function buildSwatchRow(id, colors, field){
  const row = document.getElementById(id);
  row.innerHTML='';
  colors.forEach(c=>{
    const b = document.createElement('button');
    b.className='swatch'; b.style.background=c; b.dataset.color=c;
    b.addEventListener('click', ()=>{ customConfig[field]=c; refreshBuilderUI(); });
    row.appendChild(b);
  });
}
function buildOutfitTabs(){
  const row = document.getElementById('outfitTabs');
  row.innerHTML='';
  OUTFITS.forEach(o=>{
    const b = document.createElement('button');
    b.className='outfitTab'; b.textContent=o.label; b.dataset.key=o.key;
    b.addEventListener('click', ()=>{ customConfig.outfitType=o.key; refreshBuilderUI(); });
    row.appendChild(b);
  });
}
buildOutfitTabs();
buildSwatchRow('skinRow', SKIN_TONES, 'skin');
buildSwatchRow('hairRow', HAIR_COLORS, 'hair');
buildSwatchRow('primaryRow', PRIMARY_COLORS, 'primary');
buildSwatchRow('accentRow', ACCENT_COLORS, 'accent');
document.getElementById('presetGroom').addEventListener('click', ()=>{ customConfig=Object.assign({},PRESETS.groom); refreshBuilderUI(); });
document.getElementById('presetBride').addEventListener('click', ()=>{ customConfig=Object.assign({},PRESETS.bride); refreshBuilderUI(); });
refreshBuilderUI();

/* ============================= TRACK (world space, used for physics/AI/laps) ============================= */
const TRACK = { cx: 480, cy: 300, aOut: 430, bOut: 250, aIn: 220, bIn: 105 };
const MID_A = (TRACK.aOut+TRACK.aIn)/2, MID_B = (TRACK.bOut+TRACK.bIn)/2;
const BAND_HALF = ((TRACK.aOut-TRACK.aIn)/2)/MID_A;
const START_ANGLE = -Math.PI/2;

function centerlinePoint(t){
  const ang = t*Math.PI*2;
  return { x: TRACK.cx + Math.cos(ang)*MID_A, y: TRACK.cy + Math.sin(ang)*MID_B, ang };
}
const WAYPOINT_COUNT = 72;
const WAYPOINTS = [];
for(let i=0;i<WAYPOINT_COUNT;i++) WAYPOINTS.push(centerlinePoint(i/WAYPOINT_COUNT));

function onTrack(x,y){
  const dx = x-TRACK.cx, dy = y-TRACK.cy;
  const outer = (dx/TRACK.aOut)**2 + (dy/TRACK.bOut)**2;
  const inner = (dx/TRACK.aIn)**2 + (dy/TRACK.bIn)**2;
  return outer <= 1.02 && inner >= 0.98;
}
function lateralOffset(x,y){
  const dx=x-TRACK.cx, dy=y-TRACK.cy;
  const midNorm = Math.sqrt((dx/MID_A)**2 + (dy/MID_B)**2);
  return Math.max(-1.5, Math.min(1.5, (midNorm-1)/BAND_HALF));
}

/* ============================= PSEUDO-3D ROAD MODEL ============================= */
const SEG_COUNT = 300;
const SEGMENT_LEN = 12;      // meters per segment
const ROAD_HALF_W = 6;       // meters
const CAM_HEIGHT = 1.3;      // meters
const CAM_DEPTH = 1/Math.tan((100/2)*Math.PI/180);
const DRAW_DIST = 90;        // segments rendered ahead

const ROAD = [];
(function buildRoad(){
  for(let i=0;i<SEG_COUNT;i++){
    const p0=centerlinePoint(i/SEG_COUNT), p1=centerlinePoint((i+1)/SEG_COUNT), p2=centerlinePoint((i+2)/SEG_COUNT);
    const h0=Math.atan2(p1.y-p0.y,p1.x-p0.x);
    const h1=Math.atan2(p2.y-p1.y,p2.x-p1.x);
    let dh=h1-h0; while(dh>Math.PI)dh-=Math.PI*2; while(dh<-Math.PI)dh+=Math.PI*2;
    ROAD.push({ curve: dh, alt: Math.floor(i/3)%2===0, dash: Math.floor(i/6)%2===0 });
  }
})();

const TREES = [];
for(let i=0;i<SEG_COUNT;i+=7){ TREES.push({segIdx:i, side:(i/7)%2===0?1:-1}); }

const ITEM_T = [0.12,0.28,0.42,0.58,0.72,0.88];
let items = ITEM_T.map(t=>{
  const cp = centerlinePoint(t);
  return {x:cp.x, y:cp.y, active:true, respawnAt:0, segIdx: Math.round(t*SEG_COUNT)};
});

/* ============================= CONFETTI (menu / finish only) ============================= */
const CONFETTI_COLORS = ['#e6394a','#ffcc00','#ffffff','#1fb6b0'];
let confetti = [];
function spawnConfetti(n){
  for(let i=0;i<n;i++){
    confetti.push({
      x: Math.random()*viewport.w, y: -20-Math.random()*300,
      vy: 50+Math.random()*70, vx: (Math.random()-.5)*30,
      size: 3+Math.random()*4, color: CONFETTI_COLORS[(Math.random()*CONFETTI_COLORS.length)|0],
      rot: Math.random()*Math.PI, vr:(Math.random()-.5)*4
    });
  }
}
spawnConfetti(50);
function updateConfetti(dt){
  confetti.forEach(c=>{
    c.y += c.vy*dt; c.x += c.vx*dt; c.rot += c.vr*dt;
    if(c.y>viewport.h+20){ c.y=-20; c.x=Math.random()*viewport.w; }
  });
}
function drawConfetti(g){
  confetti.forEach(c=>{
    g.save();
    g.translate(c.x,c.y); g.rotate(c.rot);
    g.fillStyle = c.color;
    g.fillRect(-c.size/2,-c.size/2,c.size,c.size);
    g.restore();
  });
}

/* ============================= KART ENTITY ============================= */
function makeKart(palette, isPlayer, startIndex){
  const spread = 0.028;
  const t0 = (START_ANGLE/(Math.PI*2)) - startIndex*spread - 0.01;
  const startPos = centerlinePoint(((t0%1)+1)%1);
  const ahead = centerlinePoint((((t0+0.01)%1)+1)%1);
  const heading0 = Math.atan2(ahead.y-startPos.y, ahead.x-startPos.x);
  return {
    p: palette, isPlayer,
    x: startPos.x, y: startPos.y, heading: heading0,
    speed:0,
    wpIndex: Math.floor((((t0%1)+1)%1)*WAYPOINT_COUNT),
    totalAngle: 0, prevAngle: null, lap:0,
    drifting:false, driftTime:0, boost:0, boostTimer:0, boostTier:0,
    finished:false, aiSpeed: 150+Math.random()*24,
    rank:1, rowEl:null
  };
}

const MAX_SPEED = 260;
const ACCEL = 240;
const BRAKE = 320;
const OFFTRACK_MULT = 0.42;
const TURN_RATE = 2.6;

function angleAround(x,y){
  const dx=(x-TRACK.cx)/MID_A, dy=(y-TRACK.cy)/MID_B;
  return Math.atan2(dy,dx);
}
function updateKartProgress(k){
  const ang = angleAround(k.x,k.y);
  if(k.prevAngle===null) k.prevAngle = ang;
  let d = ang - k.prevAngle;
  while(d>Math.PI) d-=Math.PI*2;
  while(d<-Math.PI) d+=Math.PI*2;
  k.totalAngle += d;
  k.prevAngle = ang;
  k.lap = Math.max(0, Math.floor(k.totalAngle/(Math.PI*2)));
}
function applyBoost(k, tier){
  const strength = [0, 90, 150, 230][tier];
  const duration = [0, 0.35, 0.55, 0.85][tier];
  k.boost = strength; k.boostTimer = duration; k.boostTier = tier;
}

function stepKart(k, dt, input){
  const onT = onTrack(k.x, k.y);
  const speedMult = onT ? 1 : OFFTRACK_MULT;

  k.speed += ACCEL*dt;
  if(input.brake) k.speed -= BRAKE*dt;

  const capMax = MAX_SPEED*speedMult;
  k.speed = Math.max(0, Math.min(capMax, k.speed));

  const turnFactor = Math.max(0.25, Math.min(1, k.speed/120));
  let turning = 0;
  if(input.left) turning -= 1;
  if(input.right) turning += 1;
  k.heading += turning*TURN_RATE*turnFactor*dt;

  if(input.drift && turning!==0 && k.speed > 60){
    k.drifting = true;
    k.driftTime += dt;
  } else {
    if(k.drifting){
      let tier = 0;
      if(k.driftTime>0.9) tier=3; else if(k.driftTime>0.5) tier=2; else if(k.driftTime>0.22) tier=1;
      if(tier>0) applyBoost(k, tier);
    }
    k.drifting = false; k.driftTime = 0;
  }

  let effSpeed = k.speed;
  if(k.boostTimer>0){
    k.boostTimer -= dt;
    effSpeed += k.boost;
    if(k.boostTimer<=0){ k.boost=0; k.boostTier=0; }
  }

  k.x += Math.cos(k.heading)*effSpeed*dt;
  k.y += Math.sin(k.heading)*effSpeed*dt;
  updateKartProgress(k);

  items.forEach(it=>{
    if(it.active){
      const dx=it.x-k.x, dy=it.y-k.y;
      if(dx*dx+dy*dy < 26*26){ it.active=false; it.respawnAt = raceTime+4; applyBoost(k, 2); }
    }
  });
}

function stepAI(k, dt){
  const target = WAYPOINTS[k.wpIndex];
  const dx = target.x-k.x, dy=target.y-k.y;
  const dist = Math.hypot(dx,dy);
  if(dist < 34) k.wpIndex = (k.wpIndex+1)%WAYPOINT_COUNT;
  const desired = Math.atan2(dy,dx);
  let diff = desired - k.heading;
  while(diff>Math.PI) diff-=Math.PI*2;
  while(diff<-Math.PI) diff+=Math.PI*2;

  const onT = onTrack(k.x,k.y);
  const speedMult = onT?1:OFFTRACK_MULT;
  const targetSpeed = k.aiSpeed*speedMult;
  k.speed += (targetSpeed - k.speed) * Math.min(1, dt*2.2);
  const turnFactor = Math.max(0.3, Math.min(1, k.speed/120));
  k.heading += Math.max(-1,Math.min(1,diff*2.2)) * TURN_RATE*turnFactor*dt;

  let effSpeed = k.speed;
  if(Math.abs(diff) > 0.35 && Math.random()<0.02) applyBoost(k,1);
  if(k.boostTimer>0){ k.boostTimer-=dt; effSpeed += k.boost; if(k.boostTimer<=0){k.boost=0;k.boostTier=0;} }

  k.x += Math.cos(k.heading)*effSpeed*dt;
  k.y += Math.sin(k.heading)*effSpeed*dt;
  updateKartProgress(k);

  items.forEach(it=>{
    if(it.active){
      const ddx=it.x-k.x, ddy=it.y-k.y;
      if(ddx*ddx+ddy*ddy < 26*26){ it.active=false; it.respawnAt=raceTime+4; applyBoost(k,1); }
    }
  });
}

/* ============================= GAME STATE ============================= */
let state = 'select';
let karts = [];
let player = null;
let raceTime = 0;
let countdownVal = 3;
let countdownTimer = 0;
const FINISH_LAPS = 3;
const TARGET_ANGLE = FINISH_LAPS*Math.PI*2;

const input = { left:false, right:false, brake:false, drift:false };

function setupRace(){
  const playerPalette = buildPalette(Object.assign({}, customConfig, {label:'You'}));
  const aiConfigs = [PRESETS.groomsman, PRESETS.bridesmaid, customConfig.outfitType==='gown' ? PRESETS.groom : PRESETS.bride];
  karts = [];
  player = makeKart(playerPalette, true, 0);
  karts.push(player);
  aiConfigs.forEach((cfg,i)=> karts.push(makeKart(buildPalette(cfg), false, i+1)));
  raceTime = 0;
  items.forEach(it=>{ it.active=true; it.respawnAt=0; });

  const lb = document.getElementById('leaderboard');
  lb.innerHTML = '';
  karts.forEach(k=>{
    const row = document.createElement('div');
    row.className = 'lbRow' + (k.isPlayer ? ' me' : '');
    const rank = document.createElement('div'); rank.className='lbRank'; rank.textContent='1';
    const av = bustCanvas(k.p, 28);
    const name = document.createElement('div'); name.className='lbName'; name.textContent = k.p.label;
    row.appendChild(rank); row.appendChild(av); row.appendChild(name);
    lb.appendChild(row);
    k.rowEl = row; k.rankEl = rank;
  });
}

function startCountdown(){
  setupRace();
  state = 'countdown';
  countdownVal = 3; countdownTimer = 0;
  document.getElementById('selectPanel').classList.add('hidden');
  document.getElementById('finishPanel').classList.add('hidden');
  document.getElementById('countdownPanel').classList.remove('hidden');
  document.getElementById('countdownNum').textContent = countdownVal;
  document.getElementById('hud').classList.add('hidden');
}
function beginRace(){
  document.getElementById('countdownPanel').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  state = 'race';
}
function endRace(){
  state = 'finish';
  document.getElementById('hud').classList.add('hidden');
  const sorted = [...karts].sort((a,b)=>b.totalAngle-a.totalAngle);
  const playerRank = sorted.indexOf(player)+1;
  const suffix = {1:'ST',2:'ND',3:'RD',4:'TH'}[playerRank]||'TH';
  document.getElementById('finishTitle').textContent = playerRank===1 ? 'YOU WIN!' : `${playerRank}${suffix} PLACE`;
  const box = document.getElementById('resultBox');
  box.innerHTML = '';
  const medals = ['🥇','🥈','🥉','🎗️'];
  sorted.forEach((k,i)=>{
    const row = document.createElement('div'); row.className='resRow';
    const medal = document.createElement('div'); medal.className='resMedal'; medal.textContent = medals[i]||'';
    const av = bustCanvas(k.p, 30);
    const label = document.createElement('div'); label.textContent = `${i+1}${['ST','ND','RD','TH'][Math.min(i,3)]} — ${k.p.label}${k.isPlayer?' (you)':''}`;
    row.appendChild(medal); row.appendChild(av); row.appendChild(label);
    box.appendChild(row);
  });
  document.getElementById('finishPanel').classList.remove('hidden');
  spawnConfetti(110);
}

/* ============================= INPUT ============================= */
window.addEventListener('keydown', e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) input.left = true;
  if(['ArrowRight','d','D'].includes(e.key)) input.right = true;
  if(['ArrowDown','s','S'].includes(e.key)) input.brake = true;
  if([' ','Shift','ArrowUp','w','W'].includes(e.key)) input.drift = true;
  if(e.key===' ') e.preventDefault();
});
window.addEventListener('keyup', e=>{
  if(['ArrowLeft','a','A'].includes(e.key)) input.left = false;
  if(['ArrowRight','d','D'].includes(e.key)) input.right = false;
  if(['ArrowDown','s','S'].includes(e.key)) input.brake = false;
  if([' ','Shift','ArrowUp','w','W'].includes(e.key)) input.drift = false;
});
function bindHold(id, prop){
  const el = document.getElementById(id);
  const on = (e)=>{ input[prop]=true; e.preventDefault(); };
  const off = (e)=>{ input[prop]=false; e.preventDefault(); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindHold('steerLeft','left'); bindHold('steerRight','right'); bindHold('boostBtn','drift');

document.getElementById('startBtn').addEventListener('click', startCountdown);
document.getElementById('againBtn').addEventListener('click', ()=>{
  document.getElementById('finishPanel').classList.add('hidden');
  document.getElementById('selectPanel').classList.remove('hidden');
});

resize();

/* ============================= PSEUDO-3D RENDERING ============================= */
function projectPoint(lat, z, camX, w, h){
  const zc = Math.max(z, 1.5);
  const scale = CAM_DEPTH/zc;
  const ref = h/2; // tie both axes to the same reference so wide/short viewports don't distort the road
  return {
    x: w/2 + scale*(lat-camX)*ref,
    y: h/2 + scale*CAM_HEIGHT*ref,
    w: scale*ROAD_HALF_W*ref,
    scale
  };
}

function renderChaseCam(g){
  const w = viewport.w, h = viewport.h;
  const horizonY = h*0.46;
  g.fillStyle = '#5cb2ff'; g.fillRect(0,0,w,horizonY);
  const grassGrad = g.createLinearGradient(0,horizonY,0,h);
  grassGrad.addColorStop(0,'#3ec14f'); grassGrad.addColorStop(1,'#2c9a3c');
  g.fillStyle = grassGrad; g.fillRect(0,horizonY,w,h-horizonY);

  const zTotal = (player.totalAngle/(Math.PI*2)) * SEG_COUNT * SEGMENT_LEN;
  const zSegF = zTotal/SEGMENT_LEN;
  const baseIdx = Math.floor(zSegF) % SEG_COUNT;
  const frac = zSegF - Math.floor(zSegF);
  const camX = lateralOffset(player.x,player.y) * ROAD_HALF_W * 0.85;

  // bucket dynamic sprites (AI karts + item boxes) by forward segment offset
  const buckets = {};
  function addBucket(rel, entry){ if(!buckets[rel]) buckets[rel]=[]; buckets[rel].push(entry); }
  karts.forEach(k=>{
    if(k.isPlayer) return;
    const kZSeg = (k.totalAngle/(Math.PI*2))*SEG_COUNT;
    let rel = Math.round(kZSeg) - Math.floor(zSegF);
    while(rel < -SEG_COUNT/2) rel += SEG_COUNT;
    while(rel > SEG_COUNT/2) rel -= SEG_COUNT;
    if(rel>=0 && rel<DRAW_DIST) addBucket(rel, {type:'kart', obj:k});
  });
  items.forEach(it=>{
    if(!it.active) return;
    let rel = it.segIdx - baseIdx;
    while(rel < 0) rel += SEG_COUNT;
    if(rel<DRAW_DIST) addBucket(rel, {type:'item', obj:it});
  });
  TREES.forEach(t=>{
    let rel = t.segIdx - baseIdx;
    while(rel < 0) rel += SEG_COUNT;
    if(rel<DRAW_DIST) addBucket(rel, {type:'tree', obj:t});
  });

  let x = 0, dx = 0;
  const posts = [];
  for(let n=0;n<=DRAW_DIST;n++){
    const idx = (baseIdx+n)%SEG_COUNT;
    x += dx*SEGMENT_LEN;
    dx += ROAD[idx].curve;
    const z = (n+1-frac)*SEGMENT_LEN;
    const pt = projectPoint(x, z, camX, w, h);
    posts.push(Object.assign(pt, {idx, roadX:x, z}));
  }

  for(let n=DRAW_DIST; n>=1; n--){
    const p1 = posts[n-1], p2 = posts[n];
    if(p2.y < horizonY-2) continue;
    const seg = ROAD[p1.idx];
    const roadCol = seg.alt ? '#57575f' : '#4d4d54';
    const rumbleCol = seg.alt ? '#e6394a' : '#ffffff';
    quad(g, p1.x,p1.y,p1.w*1.18, p2.x,p2.y,p2.w*1.18, rumbleCol);
    quad(g, p1.x,p1.y,p1.w, p2.x,p2.y,p2.w, roadCol);
    if(seg.dash){ quad(g, p1.x,p1.y,p1.w*0.045, p2.x,p2.y,p2.w*0.045, '#ffffff'); }

    const bucket = buckets[n];
    if(bucket){
      bucket.forEach(entry=>{
        if(entry.type==='kart'){
          const k = entry.obj;
          const lat = p1.roadX + lateralOffset(k.x,k.y)*ROAD_HALF_W*0.85;
          const sp = projectPoint(lat, p1.z, camX, w, h);
          drawBillboardKart(g, sp, k.p, k.boostTier);
        } else if(entry.type==='item'){
          const sp = projectPoint(p1.roadX, p1.z, camX, w, h);
          drawBillboardItem(g, sp);
        } else if(entry.type==='tree'){
          const lat = p1.roadX + entry.obj.side*ROAD_HALF_W*1.7;
          const sp = projectPoint(lat, p1.z, camX, w, h);
          drawBillboardTree(g, sp);
        }
      });
    }
  }

  drawForegroundKart(g, w, h);
}

function drawBillboardKart(g, sp, p, boostTier){
  const size = Math.max(3, sp.scale*220);
  g.save();
  g.translate(sp.x, sp.y - size*0.42);
  g.scale(size/22, size/22);
  drawFullKartBack(g, p, boostTier);
  g.restore();
}
function drawBillboardItem(g, sp){
  const size = Math.max(3, sp.scale*140);
  g.save();
  g.translate(sp.x, sp.y - size*0.3);
  g.scale(size/8, size/8);
  pr(g,-3,-3,6,6,'#ffcc00');
  pr(g,-3,-3,6,1.2,'#fff3b0');
  pr(g,-1.6,-2.4,0.8,1.6,'#1b1b1f');
  pr(g,-1.6,-0.6,0.8,0.8,'#1b1b1f');
  pr(g,-2.2,-3,0.8,0.8,'#1b1b1f');
  g.restore();
}
function drawBillboardTree(g, sp){
  const size = Math.max(3, sp.scale*260);
  g.save();
  g.translate(sp.x, sp.y - size*0.45);
  g.scale(size/16, size/16);
  pr(g,-1,2,2,4,'#7a5230');
  pr(g,-4,-6,8,8,'#2c9a3c');
  pr(g,-3,-9,6,5,'#36ab45');
  g.restore();
}
function drawForegroundKart(g, w, h){
  const lean = (input.left?-1:0) + (input.right?1:0);
  const unit = h*0.018;
  g.save();
  g.translate(w/2 + lean*unit*1.4, h - 8*unit);
  g.scale(unit, unit);
  drawFullKartBack(g, player.p, player.boostTier);
  g.restore();
}

function drawMinimap(g){
  if(state!=='race' && state!=='countdown') return;
  const mmW=78, mmH=52;
  const pad = 10;
  const originX = viewport.w - mmW - pad - 8;
  const originY = viewport.h - mmH - pad - 8;
  g.save();
  roundRectPath(g, originX-8, originY-8, mmW+16, mmH+16, 10);
  g.fillStyle = 'rgba(27,27,31,0.55)';
  g.fill();
  g.beginPath();
  g.ellipse(originX+mmW/2, originY+mmH/2, mmW/2, mmH/2, 0,0,Math.PI*2);
  g.strokeStyle='#ffffff'; g.lineWidth=2; g.stroke();
  karts.forEach(k=>{
    const nx = (k.x-TRACK.cx)/TRACK.aOut, ny=(k.y-TRACK.cy)/TRACK.bOut;
    const px = originX+mmW/2 + nx*(mmW/2-3);
    const py = originY+mmH/2 + ny*(mmH/2-3);
    g.fillStyle = k.p.kart;
    g.beginPath(); g.arc(px,py, k.isPlayer?4:2.6, 0, Math.PI*2); g.fill();
    if(k.isPlayer){ g.strokeStyle='#e6394a'; g.lineWidth=1.5; g.stroke(); }
  });
  g.restore();
}

/* ============================= MAIN LOOP ============================= */
let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.033, (now-lastT)/1000);
  lastT = now;

  if(state==='select' || state==='finish'){ updateConfetti(dt); }

  if(state==='countdown'){
    countdownTimer += dt;
    if(countdownTimer >= 1){
      countdownTimer = 0;
      countdownVal -= 1;
      if(countdownVal <= 0){
        document.getElementById('countdownNum').textContent = 'GO!';
        setTimeout(beginRace, 350);
        countdownVal = -1;
      } else {
        document.getElementById('countdownNum').textContent = countdownVal;
      }
    }
  }

  if(state==='race'){
    raceTime += dt;
    stepKart(player, dt, input);
    karts.forEach(k=>{ if(!k.isPlayer) stepAI(k, dt); });
    items.forEach(it=>{ if(!it.active && raceTime>it.respawnAt) it.active=true; });

    const sorted = [...karts].sort((a,b)=>b.totalAngle-a.totalAngle);
    sorted.forEach((k,i)=>{
      k.rank = i+1;
      if(k.rowEl){ k.rowEl.style.order = i; k.rankEl.textContent = (i+1)+({1:'ST',2:'ND',3:'RD',4:'TH'}[i+1]||'TH'); }
    });

    document.getElementById('lapNum').textContent = Math.min(FINISH_LAPS, player.lap+1);
    const mm = Math.floor(raceTime/60).toString().padStart(2,'0');
    const ss = (raceTime%60).toFixed(1).padStart(4,'0');
    document.getElementById('timeNum').textContent = `${mm}:${ss}`;
    const boostPct = player.drifting ? Math.min(100, player.driftTime/0.9*100) : (player.boostTimer>0?100:0);
    const bar = document.getElementById('boostBar');
    bar.style.width = boostPct+'%';
    bar.style.background = player.driftTime>0.9?'#e6394a':player.driftTime>0.5?'#ffcc00':'#2f7fe0';

    if(player.totalAngle >= TARGET_ANGLE && !player.finished){
      player.finished = true;
      endRace();
    }
  }

  ctx.clearRect(0,0,viewport.w,viewport.h);
  if(state==='race' || state==='countdown'){
    renderChaseCam(ctx);
    drawMinimap(ctx);
  } else {
    const horizonY = viewport.h*0.46;
    ctx.fillStyle = '#5cb2ff'; ctx.fillRect(0,0,viewport.w,horizonY);
    ctx.fillStyle = '#3ec14f'; ctx.fillRect(0,horizonY,viewport.w,viewport.h-horizonY);
    drawConfetti(ctx);
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

})();
